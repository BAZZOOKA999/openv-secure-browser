name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openv.jks"
      - name: Compile and test
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/openv.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease testDebugUnitTest --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OpenV.apk
          cd dist
          sha256sum OpenV.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenV-apk
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest || gh release create apk-latest --title 'OpenV 0.2-alpha — Android APK' --notes-file RELEASE_NOTES.md
          gh release edit apk-latest --title 'OpenV 0.2-alpha — Android APK' --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          gh release upload apk-latest dist/OpenV.apk dist/SHA256SUMS --clobber
